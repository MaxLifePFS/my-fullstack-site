name: Deploy sites to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # www/ is the main business site served at maxlife.cc
          - dir: www
            project: maxlife-www
          - dir: dist
            project: maxlife-academy
          - dir: trinity-inn
            project: trinity-ranch-inn
          - dir: work-hub
            project: bao-work-hub
    name: Deploy ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      # Pages caches assets for 4h and ignores Cache-Control from _headers,
      # so a deploy alone does not retire the old js/css. Renaming each file
      # after its own contents gives every deploy a URL that was never
      # cached. Only the checkout is touched; the repo keeps plain names so
      # the files stay editable and previewable as-is.
      - name: Fingerprint assets
        if: matrix.dir == 'work-hub'
        working-directory: ${{ matrix.dir }}
        run: |
          js=$(sha256sum js/main.js | cut -c1-10)
          css=$(sha256sum css/styles.css | cut -c1-10)
          mv js/main.js "js/main.$js.js"
          mv css/styles.css "css/styles.$css.css"
          sed -i "s|js/main\.js|js/main.$js.js|g; s|css/styles\.css|css/styles.$css.css|g" index.html
          grep -E 'main\.|styles\.' index.html
      - name: Deploy ${{ matrix.dir }} to ${{ matrix.project }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Run from inside each site folder so wrangler picks up that
          # site's functions/ directory (trinity-inn has one for /api).
          workingDirectory: ${{ matrix.dir }}
          command: pages deploy . --project-name ${{ matrix.project }} --branch main

  # main.maxlife.cc is not a Pages project like the four above: it is a
  # Next.js app that OpenNext compiles into a Cloudflare Worker, and it owns
  # the D1 binding behind the FlexStay calendar. So it needs its own job
  # rather than another row in the matrix.
  deploy-main-site:
    runs-on: ubuntu-latest
    name: Deploy main-site (main.maxlife.cc)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: main-site/package-lock.json
      - name: Install dependencies
        working-directory: main-site
        run: npm ci
      - name: Build and deploy the Worker
        working-directory: main-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Next.js inlines NEXT_PUBLIC_* at build time, so the URL has to be
          # here: the Worker secret of the same name is read too late and the
          # lead form would ship with an undefined Supabase URL. The
          # service-role key is NOT inlined, so it stays a Worker secret.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: npm run deploy
